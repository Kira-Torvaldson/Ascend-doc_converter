name: CI
on:
  push:
    branches: ['**']
    paths-ignore: ['*.adoc']
  pull_request:
    branches: [main]
    paths-ignore: ['*.adoc']
  schedule:
  - cron: '30 2 * * MON'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  activate:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.repository_owner == 'opendevise') ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'docs/'))
    runs-on: ubuntu-latest
    steps:
    - name: Proceed
      run: echo ok go
  build:
    needs: activate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: |
        npm run lint
        if [ -n "$(npm --silent run format && git --no-pager diff --name-only)" ]; then
          echo 'Detected pending code style changes'
          exit 1
        fi
    - name: Run tests with coverage
      run: npm run coverage
    - name: Run backend lint (existing backend scope)
      run: npm --prefix api/backend run lint
    - name: Run security scoped lint
      run: npm run lint:security:scope
    - name: Run security regression tests
      run: npm run test:security
  ascend:
    needs: activate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Check Ascend version sync
      run: node scripts/check-version-sync.js
    - name: Install Pandoc
      run: sudo apt-get update && sudo apt-get install -y pandoc
    - name: Install backend dependencies
      run: npm --prefix api/backend ci
    - name: Install frontend dependencies
      run: npm --prefix api/frontend ci
    - name: Frontend unit tests
      run: npm --prefix api/frontend run test
    - name: Backend e2e (AsciiDoc -> Markdown, downdoc)
      run: |
        node api/backend/scripts/verify-e2e-to-markdown-representative-scenarios.js
        node api/backend/scripts/verify-e2e-to-markdown-failure-contract.js
    - name: Backend e2e (Markdown -> AsciiDoc, Pandoc)
      run: node api/backend/scripts/verify-e2e-to-asciidoc-representative-scenarios.js
    - name: Backend e2e (Text -> Markdown)
      run: |
        node api/backend/scripts/verify-e2e-text-to-markdown-representative-scenarios.js
        node api/backend/scripts/verify-e2e-text-to-markdown-failure-contract.js
    - name: Backend e2e (HTML conversions)
      run: |
        node api/backend/scripts/verify-e2e-from-html-representative-scenarios.js
        node api/backend/scripts/verify-e2e-from-html-failure-contract.js
    - name: Golden corpus (non-regression)
      run: npm --prefix api/backend run test:golden
    - name: Roundtrip adoc-md-adoc (semantic)
      run: npm --prefix api/backend run test:roundtrip
    - name: API abuse tests
      run: npm run test:abuse
