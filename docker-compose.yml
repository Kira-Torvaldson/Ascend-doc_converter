services:
  backend:
    build:
      context: .
      dockerfile: api/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3003
      LOGS_DIR: /app/api/backend/logs
      TMPDIR: /app/api/backend/tmp
    volumes:
      - ascend-logs:/app/api/backend/logs
      - ascend-tmp:/app/api/backend/tmp
    expose:
      - "3003"
    restart: unless-stopped

  frontend:
    build:
      context: ./api/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ascend-logs:
  ascend-tmp:
