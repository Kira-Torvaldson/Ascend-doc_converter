<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1428"/>
      <stop offset="40%" stop-color="#131c33"/>
      <stop offset="100%" stop-color="#0a101f"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="75%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="12%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1e40af" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#aurora1)"/>
  <rect width="1920" height="1080" fill="url(#aurora2)"/>
  <rect width="1920" height="1080" fill="url(#aurora3)"/>
  <rect width="1920" height="1080" fill="url(#halo)"/>

  <!-- Constellation dots -->
  <g fill="#bfdbfe">
    <circle cx="180" cy="120" r="1.6" opacity="0.5"/>
    <circle cx="420" cy="240" r="1.1" opacity="0.35"/>
    <circle cx="660" cy="90" r="1.4" opacity="0.45"/>
    <circle cx="900" cy="200" r="1.0" opacity="0.3"/>
    <circle cx="1150" cy="70" r="1.7" opacity="0.5"/>
    <circle cx="1380" cy="180" r="1.2" opacity="0.4"/>
    <circle cx="1620" cy="90" r="1.5" opacity="0.45"/>
    <circle cx="1800" cy="260" r="1.1" opacity="0.35"/>
    <circle cx="300" cy="420" r="1.2" opacity="0.3"/>
    <circle cx="1500" cy="380" r="1.3" opacity="0.35"/>
    <circle cx="1050" cy="330" r="1.0" opacity="0.28"/>
    <circle cx="760" cy="470" r="1.2" opacity="0.3"/>
  </g>

  <!-- Layered horizon waves -->
  <path fill="url(#wave1)" d="M0 700 Q 320 620, 640 668 T 1280 640 T 1920 620 V 1080 H 0 Z"/>
  <path fill="#1e293b" fill-opacity="0.4" d="M0 780 Q 480 710, 960 762 T 1920 730 V 1080 H 0 Z"/>
  <path fill="url(#wave2)" d="M0 880 Q 640 820, 1280 866 T 1920 840 V 1080 H 0 Z"/>

  <!-- Fine ascending line accent (Ascend) -->
  <path d="M -40 940 Q 480 760, 980 640 T 1960 300" fill="none" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="2.5"/>
  <path d="M -40 990 Q 520 830, 1020 704 T 1960 380" fill="none" stroke="#818cf8" stroke-opacity="0.10" stroke-width="1.5"/>
</svg>
